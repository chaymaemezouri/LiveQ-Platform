services:
  postgres:
    image: postgres:17-alpine
    container_name: liveq-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liveq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveq}
      POSTGRES_DB: ${POSTGRES_DB:-liveq}
    volumes:
      - liveq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-liveq} -d ${POSTGRES_DB:-liveq}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  liveq_postgres_data:
